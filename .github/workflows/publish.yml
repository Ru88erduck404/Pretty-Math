name: Publish

# Pushing a version tag releases that version. A plain push to main does not,
# so day-to-day commits never reach anyone's editor by accident.
#
#   git push origin main --follow-tags
#
# The two halves are separate on purpose. Building the .vsix and attaching it
# to a GitHub release needs nothing but the repository, and always happens.
# Sending it to the Marketplace needs an identity, and is skipped when there
# is not one -- a repository that has not been set up for publishing yet still
# gets a green run and a downloadable build, rather than a red cross and no
# release at all.
#
# Setting the identity up is a one-time job, written down in RELEASING.md. In
# short: a managed identity in Entra, a federated credential naming this
# repository's "release" environment, AZURE_CLIENT_ID and AZURE_TENANT_ID as
# repository variables, and that identity made a Contributor on the publisher.
# The personal access tokens this used to want are retired on 1 December 2026.
#
# OVSX_PAT is unrelated and optional: Open VSX is run by the Eclipse
# Foundation, keeps its own tokens, and is what VSCodium installs from.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check publish rights without publishing anything'
        type: boolean
        default: false

jobs:
  # Everything that needs no credentials, so that it cannot be the thing that
  # fails.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub release
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the tests before releasing anything
        run: |
          node test/run.js
          node test/host.js
          node test/corpus.js
          node test/libraries.js
          node test/checks.js
          node test/hostile.js
          node test/fuzz.js

      - name: Check the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest" >&2
            exit 1
          fi
          echo "Releasing $manifest"

      - name: Build the .vsix
        run: npx --yes @vscode/vsce package --no-dependencies --out pretty-math.vsix

      - name: Keep the build for the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: pretty-math.vsix
          retention-days: 7

      - name: Attach the .vsix to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: pretty-math.vsix
          generate_release_notes: true

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' && !inputs.dry_run }}
        run: npx --yes ovsx publish pretty-math.vsix --pat "$OVSX_PAT"

      - name: Say whether the Marketplace step will run
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "An identity is configured; the Marketplace job follows."
          else
            echo "::notice::No AZURE_CLIENT_ID is set, so this build was not sent to"\
                 "the Marketplace. The .vsix is attached to the release and can be"\
                 "uploaded by hand. See RELEASING.md to set publishing up."
          fi

  # Only this half needs an identity, and only this half is skipped without
  # one. The environment lives here so that no deployment is recorded for a
  # publish that was never going to be attempted.
  marketplace:
    needs: release
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # to request the OIDC token Entra checks
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Publishing touches no Azure resources, so the identity needs no
          # subscription and the login must be told not to look for one.
          allow-no-subscriptions: true

      # Signing in only proves GitHub can authenticate as the identity. Whether
      # that identity may publish is a separate grant on the publisher, so it is
      # worth failing here rather than halfway through.
      - name: Check the identity may publish
        run: npx --yes @vscode/vsce verify-pat --azure-credential ru88erduck404

      - name: Show the identity's Marketplace id
        if: inputs.dry_run
        run: |
          echo "Add this id to the publisher as a Contributor:"
          az rest --method get --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=6.0" \
            --query id -o tsv

      - name: Publish to the Visual Studio Marketplace
        if: ${{ !inputs.dry_run }}
        run: npx --yes @vscode/vsce publish --azure-credential --packagePath pretty-math.vsix
